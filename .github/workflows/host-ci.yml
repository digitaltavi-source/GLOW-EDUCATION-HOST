name: host-ci

on:
  push:
    branches:
      - main
      - sandbox
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build public host and staging UI
        run: npm run build

      - name: Test public contracts and security boundary
        run: npm test

      - name: Verify staging UI packaged
        run: |
          test -s dist/public/index.html
          grep -q "GLOW Education" dist/public/index.html
          grep -q "Mission Control" dist/public/index.html

      - name: Runtime smoke from hidden parent path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .host-smoke
          mkdir -p .host-smoke/public-host
          cp -a dist package.json node_modules .host-smoke/public-host/
          (
            cd .host-smoke/public-host
            PORT=3191 \
            GLOW_ALLOWED_HOSTS=127.0.0.1,localhost \
            GLOW_PROTECTED_SERVICE_URL=https://protected.example \
            GLOW_PROTECTED_SERVICE_TOKEN=ci-placeholder-token \
            GLOW_AUTH_MODE=staging_disabled \
            node dist/src/server.js > /tmp/glow-host-smoke.log 2>&1 &
            echo $! > /tmp/glow-host-smoke.pid
          )
          PID="$(cat /tmp/glow-host-smoke.pid)"
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3191/healthz >/tmp/host-health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3191/ >/tmp/host-root.html
          curl -fsS http://127.0.0.1:3191/app >/tmp/host-app.html
          curl -fsS http://127.0.0.1:3191/oauth-client.js >/tmp/oauth-client.js
          curl -fsS http://127.0.0.1:3191/web-client.js >/tmp/web-client.js
          grep -q "Mission Control" /tmp/host-root.html
          grep -q "Tạo mission thật" /tmp/host-root.html
          cmp /tmp/host-root.html /tmp/host-app.html
          test -s /tmp/oauth-client.js
          test -s /tmp/web-client.js
          if grep -q "CONFIG_OAUTH_ISSUER_REQUIRED" /tmp/glow-host-smoke.log; then
            cat /tmp/glow-host-smoke.log
            exit 1
          fi

      - name: Reject obvious secrets and private implementation paths
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist             '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' .; then
            echo "Potential secret material found"
            exit 1
          fi
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist             '(education-factory-next/|private-runtime/|release-assets/GLOW_EDUCATION_CAPABILITY_SYSTEM|host-integration/node-private-host/v2_staging_bridge)'             --include='*.ts' --include='*.js' --include='*.mjs' --include='*.json' --include='*.md' .; then
            echo "Private Factory implementation path leaked into public repository"
            exit 1
          fi
